<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="a-gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#A67C12"/><stop offset="1" stop-color="#F0D98C"/>
    </linearGradient>
    <linearGradient id="a-bright" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E3C670"/><stop offset="1" stop-color="#FFE9A8"/>
    </linearGradient>
  </defs>

  <!-- panel -->
  <rect x="5" y="8" width="54" height="48" rx="6" fill="#F7F3E8"/>
  <rect x="5" y="8" width="54" height="9" rx="6" fill="#E3D9BF"/>
  <g fill="#B8901F" opacity=".7">
    <circle cx="12" cy="12.5" r="1.8"/><circle cx="18" cy="12.5" r="1.8"/>
  </g>

  <!-- bars -->
  <g fill="url(#a-gold)">
    <rect x="13" y="36" width="8" height="14" rx="2"/>
    <rect x="25" y="30" width="8" height="20" rx="2"/>
    <rect x="37" y="24" width="8" height="26" rx="2"/>
    <rect x="49" y="32" width="6" height="18" rx="2" opacity=".55"/>
  </g>

  <!-- trend arrow -->
  <path d="M13 32 26 23l9 5 14-9" stroke="url(#a-bright)" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M43 19h8v8" stroke="url(#a-bright)" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
